name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The Signal K app store installs plugins with --ignore-scripts,
      # so the tests run against a tree installed the same way.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      # What ships: the built pages and the icon the server shows.
      - run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          for f in public/keypad.js public/runtime.js public/app.js public/icon-72x72.png docs/screenshots/freeboard-window.png; do
            grep -q " $f" pack.txt || { echo "missing from the package: $f"; exit 1; }
          done
